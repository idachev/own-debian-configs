# On AC, logind must ignore the lid: csd-power only takes handle-lid-switch
# when an external monitor is attached. Cinnamon lid-close-ac-action=blank
# still locks. Battery lid-close stays HandleLidSwitch=suspend.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
